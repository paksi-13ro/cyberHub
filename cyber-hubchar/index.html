<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 1rem;
        background: #1a1a1f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
    }
    .header { text-align: center; margin-bottom: 1rem; }
    .header h1 { color: #ff2d20; margin: 0 0 0.3rem; font-size: 1.5rem; }
    .header p { color: #888; font-size: 0.85rem; margin: 0; }

    .controls {
        position: fixed; top: 1rem; right: 1rem;
        background: #12121c; padding: 0.6rem 0.8rem;
        border-radius: 6px; border: 1px solid #333;
        font-size: 0.8rem; z-index: 100;
        display: flex; flex-direction: column; gap: 0.3rem;
    }
    .controls button {
        background: #ff2d20; color: #fff; border: none;
        padding: 0.4rem 0.7rem; cursor: pointer;
        border-radius: 4px; font-size: 0.75rem;
    }
    .controls button.secondary { background: #333; }

    .sheet-wrapper { max-width: 1200px; margin: 0 auto; }
    .sheet-page {
        position: relative;
        width: 100%;
        margin-bottom: 2rem;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
    }
    .sheet-page svg { display: block; width: 100%; height: auto; }

    /* ============ ПОЛЯ ВВОДА ============ */
    .sheet-field {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #000;
        padding: 0 3px;
        outline: none;
        box-sizing: border-box;
        line-height: 1;
    }
    .sheet-field:focus {
        background: rgba(180, 220, 255, 0.15);
        outline: none;
    }
    .sheet-field::placeholder {
        color: rgba(0, 0, 0, 0.2);
        font-style: italic;
    }
    /* Убираем спиннеры number-полей */
    .sheet-field[type="number"]::-webkit-outer-spin-button,
    .sheet-field[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    .sheet-field[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
    .sheet-field::-ms-clear,
    .sheet-field::-ms-reveal { display: none; }
    .sheet-field::-webkit-search-cancel-button { display: none; }

    /* ============ READONLY (STAT / СУМ) ============ */
    .sheet-readonly {
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #000;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
        background: transparent;
        font-weight: 500;
    }

    /* ============ ЧЕКБОКСЫ (КИБЕРМИЛАНТЫ) ============ */
    .sheet-checkbox {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 100%;
        border: 1.5px solid rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        margin: 0;
        display: block;
        position: relative;
        box-sizing: border-box;
    }
    .sheet-checkbox:hover {
        background: rgba(255, 45, 32, 0.15);
        border-color: rgba(255, 45, 32, 0.6);
    }
    .sheet-checkbox:checked {
        background: rgba(255, 45, 32, 0.85);
        border-color: #ff2d20;
    }
    .sheet-checkbox:checked::after {
        content: '✓';
        color: #fff;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
    }

    /* ============ РЕЖИМ ОТЛАДКИ ============ */
    body.debug .sheet-field {
        background: rgba(255, 255, 200, 0.35);
        border: 1px solid rgba(255, 100, 0, 0.5);
    }
    body.debug .sheet-readonly {
        background: rgba(200, 255, 200, 0.4);
        border: 1px solid rgba(0, 180, 0, 0.5);
    }
    body.debug .sheet-checkbox {
        background: rgba(200, 200, 255, 0.4);
        border: 1.5px solid rgba(0, 0, 255, 0.5);
    }

    .sheet-field[data-multiline] {
        resize: none;
        padding: 3px 5px;
        line-height: 1.3;
    }
</style>

            <!-- Приобретение репутации -->
            <foreignObject x="380" y="157" width="269" height="54">
                <textarea xmlns="http://www.w3.org/1999/xhtml" id="preobrepu" placeholder="Приобретение репутации" class="sheet-field" style="resize:none;line-height:1.3;"></textarea>
            </foreignObject>


        </svg>
    </div>

    <!-- ============ СТРАНИЦА 3 ============ -->
    <div class="sheet-page">
        <svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
            <image href="img/page-3.jpg" x="0" y="0" width="1400" height="1000"/>

            <!-- Пример чекбокса на кибермилант (удали или скопируй) -->
            <!--
            <foreignObject x="100" y="200" width="20" height="20">
                <input type="checkbox" xmlns="http://www.w3.org/1999/xhtml" id="implant-cybereye-right" class="sheet-checkbox"/>
            </foreignObject>
            -->
        </svg>
    </div>

</div>

<script>
// ============================================================
//  ОТЛАДКА
// ============================================================
document.getElementById('toggle-debug').addEventListener('change', (e) => {
    document.body.classList.toggle('debug', e.target.checked);
});

// ============================================================
//  АВТОРАСЧЁТ НАВЫКОВ
// ============================================================

// Получить значение характеристики по её ID
function getStatValue(statId) {
    const el = document.getElementById(statId);
    return el ? (parseInt(el.value) || 0) : 0;
}

// Обновить все STAT-поля (у которых есть data-stat)
function updateAllStats() {
    document.querySelectorAll('.sheet-readonly[data-stat]').forEach(el => {
        const statId = el.dataset.stat;
        const value = getStatValue(statId);
        el.textContent = value || '—';
    });
}

// Обновить все СУМ-поля (rank + stat)
function updateAllSums() {
    document.querySelectorAll('[id$="-rank"]').forEach(rankEl => {
        const prefix = rankEl.id.replace(/-rank$/, '');
        const statEl = document.getElementById(prefix + '-stat');
        const sumEl = document.getElementById(prefix + '-sum');
        if (!statEl || !sumEl) return;

        const rank = parseInt(rankEl.value) || 0;
        const stat = parseInt(statEl.textContent) || 0;
        sumEl.textContent = (rank + stat) || '—';
    });
}

// Полный пересчёт
function recalculate() {
    updateAllStats();
    updateAllSums();
}

// Пересчёт при вводе характеристики
['int', 'rea', 'lov', 'teh', 'har', 'vol', 'yda', 'sko', 'tel', 'emp'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', recalculate);
});

// Пересчёт при вводе ранга любого навыка
document.addEventListener('input', (e) => {
    if (e.target && e.target.id && e.target.id.endsWith('-rank')) {
        updateAllSums();
    }
});

// Первичный пересчёт
document.addEventListener('DOMContentLoaded', recalculate);

// ============================================================
//  СОХРАНЕНИЕ / ЗАГРУЗКА (localStorage)
// ============================================================
document.getElementById('save-draft').addEventListener('click', () => {
    const data = {};
    document.querySelectorAll('.sheet-field, .sheet-checkbox').forEach(el => {
        if (!el.id) return;
        data[el.id] = el.type === 'checkbox' ? el.checked : el.value;
    });
    localStorage.setItem('cpred_sheet_draft', JSON.stringify(data));
    alert('Черновик сохранён');
});

document.getElementById('load-draft').addEventListener('click', () => {
    const raw = localStorage.getItem('cpred_sheet_draft');
    if (!raw) { alert('Черновик не найден'); return; }
    const data = JSON.parse(raw);
    Object.entries(data).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!val;
        else el.value = val;
    });
    recalculate();
    alert('Черновик загружен');
});

document.getElementById('clear-all').addEventListener('click', () => {
    if (!confirm('Очистить все поля?')) return;
    document.querySelectorAll('.sheet-field').forEach(el => el.value = '');
    document.querySelectorAll('.sheet-checkbox').forEach(el => el.checked = false);
    recalculate();
});
</script>

</body>
</html>
