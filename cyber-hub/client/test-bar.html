<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест — Бар «У слепого взгляда»</title>
<link rel="stylesheet" href="style.css">
<style>
    body {
        background: #05050a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .bar-scene {
        position: relative;
        width: 100%;
        max-width: 900px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
            0 0 60px rgba(160, 108, 255, 0.3),
            0 0 120px rgba(255, 45, 149, 0.15),
            inset 0 0 0 1px rgba(160, 108, 255, 0.3);
    }
    .bar-scene svg {
        display: block;
        width: 100%;
        height: auto;
    }

    /* ---- Мерцание ламп ---- */
    .lamp-glow {
        animation: lampFlicker 4s infinite;
        transform-origin: center;
    }
    .lamp-glow:nth-child(2) { animation-delay: 1.3s; }
    .lamp-glow:nth-child(3) { animation-delay: 2.7s; }

    @keyframes lampFlicker {
        0%, 100% { opacity: 1; }
        47% { opacity: 1; }
        48% { opacity: 0.5; }
        49% { opacity: 1; }
        50% { opacity: 0.7; }
        51% { opacity: 1; }
    }

    /* ---- Луна пульсирует ---- */
    .moon {
        animation: moonPulse 8s ease-in-out infinite;
    }
    @keyframes moonPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
    }

    /* ---- Звёзды мерцают ---- */
    .star {
        animation: starTwinkle 3s infinite;
    }
    .star:nth-child(2n) { animation-delay: 0.5s; }
    .star:nth-child(3n) { animation-delay: 1.2s; }
    .star:nth-child(5n) { animation-delay: 2s; }

    @keyframes starTwinkle {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }

    /* ---- Пар/дым от бутылок ---- */
    .steam {
        animation: steamRise 5s infinite;
        transform-origin: center bottom;
    }
    .steam:nth-child(2) { animation-delay: 1.6s; }
    .steam:nth-child(3) { animation-delay: 3.2s; }

    @keyframes steamRise {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        20% { opacity: 0.6; }
        100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
    }

    /* ---- Отражение света на стойке ---- */
    .counter-shine {
        animation: shine 6s ease-in-out infinite;
    }
    @keyframes shine {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
    }

    /* ---- Лёгкое мерцание неона ---- */
    .neon-text {
        animation: neonPulse 3s ease-in-out infinite;
    }
    @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #00e5ff) drop-shadow(0 0 12px #00e5ff); }
        50% { filter: drop-shadow(0 0 10px #00e5ff) drop-shadow(0 0 24px #00e5ff) drop-shadow(0 0 40px #00e5ff); }
    }
</style>
