<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лист персонажа — тест</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 1rem;
        background: #1a1a1f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
    }
    .header { text-align: center; margin-bottom: 1rem; }
    .header h1 { color: #ff2d20; margin: 0 0 0.3rem; font-size: 1.5rem; }
    .header p { color: #888; font-size: 0.85rem; margin: 0; }

    .controls {
        position: fixed; top: 1rem; right: 1rem;
        background: #12121c; padding: 0.6rem 0.8rem;
        border-radius: 6px; border: 1px solid #333;
        font-size: 0.8rem; z-index: 100;
    }
    .controls button {
        background: #ff2d20; color: #fff; border: none;
        padding: 0.4rem 0.7rem; cursor: pointer;
        border-radius: 4px; font-size: 0.8rem; margin-left: 0.4rem;
    }

    .sheet-wrapper {
        max-width: 1000px;
        margin: 0 auto;
    }

    .sheet-page {
        position: relative;
        width: 100%;
        margin-bottom: 2rem;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
    }

    .sheet-page svg {
        display: block;
        width: 100%;
        height: auto;
    }

    /* Стили для инпутов */
    .sheet-field {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #000;
    padding: 0 3px;
    outline: none;
    box-sizing: border-box;
    line-height: 1;
    }

    /* При фокусе — очень лёгкий подсвет, чтобы видеть, куда пишешь */
    .sheet-field:focus {
        background: rgba(180, 220, 255, 0.25);
        outline: none;
    }

    /* Плейсхолдер — слабый серый, чтобы не портил вид */
    .sheet-field::placeholder {
        color: rgba(0, 0, 0, 0.25);
        font-style: italic;
    }

    /* Полное отключение спиннеров у number-полей */
    .sheet-field[type="number"]::-webkit-outer-spin-button,
    .sheet-field[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    .sheet-field[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }

    /* Убрать стрелки и у select, и у number, и у любых браузерных декораций */
    .sheet-field::-ms-clear,
    .sheet-field::-ms-reveal {
        display: none;
    }
    .sheet-field::-webkit-search-cancel-button {
        display: none;
    }

    /* Режим отладки — рамки для подбора координат */
    body.debug .sheet-field {
        background: rgba(255, 255, 200, 0.35);
        border: 1px solid rgba(255, 100, 0, 0.5);
    }
    .sheet-field[data-multiline] {
    resize: none;
    padding: 3px 5px;
    line-height: 1.3;
    }
</style>
</head>
<body class="debug">

<div class="controls">
    <label>
        <input type="checkbox" id="toggle-debug" checked>
        Показать поля
    </label>
</div>

<div class="header">
    <h1>Лист персонажа — Cyberpunk RED</h1>
    <p>Тест. Поля пока видны для отладки.</p>
</div>

            </foreignObject>

                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="rea" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Ловкость -->
            <foreignObject x="398" y="233" width="54" height="39">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="lov" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Техника -->
            <foreignObject x="398" y="295" width="54" height="41">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="teh" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Харизма -->

            </foreignObject>

            <!-- Удача -->
            <foreignObject x="432" y="502" width="19" height="26">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="yda" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Скорость -->
            <foreignObject x="398" y="554" width="52" height="38">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="sko" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Тело -->
            <foreignObject x="398" y="618" width="52" height="39">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="tel" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Эмпатия -->
            <foreignObject x="432" y="693" width="18" height="29">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="emp" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Азартные игры -->
            <foreignObject x="627" y="706" width="27" height="16">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="1" placeholder="" style="text-align:center;"></input>
            </foreignObject>

            <!-- Здоровье -->
            <foreignObject x="234" y="760" width="67" height="29">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="zdorov" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Завсимости-->
            <foreignObject x="311" y="849" width="145" height="57">
                <input type="text" xmlns="http://www.w3.org/1999/xhtml" id="zavi" placeholder="" class="sheet-field" style=""></input>
            </foreignObject>

            <!-- Человечность -->
            <foreignObject x="274" y="695" width="104" height="30">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="chel" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>

            <!-- Концентрация -->
            <foreignObject x="627" y="112" width="29" height="17">

            </foreignObject>

            <!-- Сумма концентрация и воля -->
            <foreignObject x="695" y="112" width="35" height="19">
                <input type="number" xmlns="http://www.w3.org/1999/xhtml" id="2" placeholder="" class="sheet-field" style="text-align:center;"></input>
            </foreignObject>
        </svg>
    </div>

    <!-- ============ СТРАНИЦА 2 ============ -->
    <div class="sheet-page">
        <svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
            <image href="img/page-2.jpg" x="0" y="0" width="1400" height="1000"/>
        </svg>
    </div>

    <!-- ============ СТРАНИЦА 3 ============ -->
    <div class="sheet-page">
        <svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
            <image href="img/page-3.jpg" x="0" y="0" width="1400" height="1000"/>
        </svg>
    </div>

</div>

<script>
    document.getElementById('toggle-debug').addEventListener('change', (e) => {
        document.body.classList.toggle('debug', e.target.checked);
    });
</script>

</body>
</html>
