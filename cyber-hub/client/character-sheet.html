<title>Лист персонажа — Cyberpunk RED</title>
<meta name="description" content="Интерактивный лист персонажа Cyberpunk RED. Автоподсчёт навыков, характеристики, оружие, броня, кибермиланты, печать и сохранение.">
<meta name="keywords" content="лист персонажа Cyberpunk RED, чарник, редактор персонажа, интерактивный лист">
<meta name="robots" content="noindex, follow">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 1rem;
        background: #1a1a1f;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
    }
    .header { text-align: center; margin-bottom: 1rem; }
    .header h1 { color: #ff2d20; margin: 0 0 0.3rem; font-size: 1.5rem; }
    .header p { color: #888; font-size: 0.85rem; margin: 0; }

    .controls {
        position: fixed; top: 1rem; right: 1rem;
        background: #12121c; padding: 0.6rem 0.8rem;
        border-radius: 6px; border: 1px solid #333;
        font-size: 0.8rem; z-index: 100;
        display: flex; flex-direction: column; gap: 0.3rem;
    }
    .controls button {
        background: #ff2d20; color: #fff; border: none;
        padding: 0.4rem 0.7rem; cursor: pointer;
        border-radius: 4px; font-size: 0.75rem;
    }
    .controls button.secondary { background: #333; }

    .sheet-wrapper { max-width: 1200px; margin: 0 auto; }
    .sheet-page {
        position: relative;
        width: 100%;
        margin-bottom: 2rem;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
    }
    .sheet-page svg { display: block; width: 100%; height: auto; }

    /* ============ ПОЛЯ ВВОДА ============ */
    .sheet-field {
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #000;
        padding: 0 3px;
        outline: none;
        box-sizing: border-box;
        line-height: 1;
    }
    .sheet-field:focus {
        background: rgba(180, 220, 255, 0.15);
        outline: none;
    }
    .sheet-field::placeholder {
        color: rgba(0, 0, 0, 0.2);
        font-style: italic;
    }
    /* Убираем спиннеры number-полей */
    .sheet-field[type="number"]::-webkit-outer-spin-button,
    .sheet-field[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    .sheet-field[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
    }
    .sheet-field::-ms-clear,
    .sheet-field::-ms-reveal { display: none; }
    .sheet-field::-webkit-search-cancel-button { display: none; }

    /* ============ READONLY (STAT / СУМ) ============ */
    .sheet-readonly {
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #000;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
        background: transparent;
        font-weight: 500;
    }

    /* ============ ЧЕКБОКСЫ (КИБЕРМИЛАНТЫ) ============ */
    .sheet-checkbox {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 100%;
        border: 1.5px solid rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        margin: 0;
        display: block;
        position: relative;
        box-sizing: border-box;
    }
    .sheet-checkbox:hover {
        background: rgba(255, 45, 32, 0.15);
        border-color: rgba(255, 45, 32, 0.6);
    }
    .sheet-checkbox:checked {
        background: rgba(255, 45, 32, 0.85);
        border-color: #ff2d20;
    }
    .sheet-checkbox:checked::after {
        content: '✓';
        color: #fff;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
    }

    /* ============ РЕЖИМ ОТЛАДКИ ============ */
    body.debug .sheet-field {
        background: rgba(255, 255, 200, 0.35);
        border: 1px solid rgba(255, 100, 0, 0.5);
    }
    body.debug .sheet-readonly {
        background: rgba(200, 255, 200, 0.4);
        border: 1px solid rgba(0, 180, 0, 0.5);
    }
    body.debug .sheet-checkbox {
        background: rgba(200, 200, 255, 0.4);
        border: 1.5px solid rgba(0, 0, 255, 0.5);
    }

    .sheet-field[data-multiline] {
        resize: none;
        padding: 3px 5px;
        line-height: 1.3;
    }
    /* ============================================================
       ВЕРХНЯЯ ПАНЕЛЬ (шапка редактора)
       ============================================================ */
    .sheet-toolbar {
        position: sticky;
        top: 70px;
        z-index: 50;
        background: rgba(18, 18, 28, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.8rem 1rem;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.8rem;
        flex-wrap: wrap;
    }
    .sheet-toolbar-name {
        color: var(--neon-cyan);
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        letter-spacing: 2px;
        flex: 1;
    }
    .sheet-toolbar-name input {
        background: transparent;
        border: none;
        color: var(--neon-cyan);
        font-family: inherit;
        font-size: inherit;
        letter-spacing: inherit;
        padding: 0.2rem 0.4rem;
        border-bottom: 1px dashed rgba(0, 229, 255, 0.3);
        outline: none;
        width: 100%;
        max-width: 400px;
    }
    .sheet-toolbar-name input:focus {
        border-bottom-color: var(--neon-cyan);
        background: rgba(0, 229, 255, 0.05);
    }
    .sheet-toolbar-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
    }
    .sheet-btn-mini {
        padding: 0.5rem 1rem;
        background: transparent;
        color: var(--neon-cyan);
        border: 1px solid var(--neon-cyan);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.78rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
    }
    .sheet-btn-mini:hover {
        background: var(--neon-cyan);
        color: var(--bg);
    }
    .sheet-btn-mini.pink {
        color: var(--neon-pink);
        border-color: var(--neon-pink);
    }
    .sheet-btn-mini.pink:hover {
        background: var(--neon-pink);
        color: var(--bg);
    }
    .sheet-btn-mini.yellow {
        color: var(--neon-yellow);
        border-color: var(--neon-yellow);
    }
    .sheet-btn-mini.yellow:hover {
        background: var(--neon-yellow);
        color: var(--bg);
    }
    .sheet-btn-mini:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .sheet-save-status {
        font-size: 0.78rem;
        color: var(--text-dim);
        letter-spacing: 1px;
    }
    .sheet-save-status.saving { color: var(--neon-yellow); }
    .sheet-save-status.saved { color: var(--neon-green); }
    .sheet-save-status.error { color: var(--neon-pink); }

    /* ============================================================
       АВАТАР ПЕРСОНАЖА
       ============================================================ */
    .avatar-container {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.05);
    }
    .avatar-container img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
    }
    .avatar-container .avatar-placeholder {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-size: 3em;
        color: rgba(0, 0, 0, 0.15);
        font-family: Arial, sans-serif;
    }
    .avatar-container .avatar-hint {
        position: absolute;
        inset: 0;
        background: rgba(255, 45, 149, 0.85);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9em;
        font-weight: 600;
        text-align: center;
        padding: 5px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
    }
    .avatar-container:hover .avatar-hint { opacity: 1; }
    .avatar-container input[type=file] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
    }
 
    /* ============================================================
       СТИЛИ ПЕЧАТИ
       ============================================================ */
        @media print {
        /* Размер печатной страницы — альбомная A4 */
        @page {
            size: A4 landscape;
            margin: 0;
        }

        html, body {
            background: #fff !important;
            padding: 0 !important;
            margin: 0 !important;
            color: #000 !important;
            width: 297mm;
            height: 210mm;
        }

        /* Прячем всё лишнее */
        header.site-header,
        footer.site-footer,
        .sheet-toolbar,
        .controls,
        .header,
        #toast-container,
        .sheet-actions {
            display: none !important;
        }

        main {
            padding: 0 !important;
            max-width: none !important;
        }

        .sheet-wrapper {
            max-width: none !important;
            margin: 0 !important;
        }

        /* Каждый лист — ровно одна печатная страница */
        .sheet-page {
            width: 297mm !important;
            height: 210mm !important;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            page-break-after: always;
            page-break-inside: avoid;
            overflow: hidden;
            position: relative;
        }

        /* Последняя страница — без разрыва */
        .sheet-page:last-child {
            page-break-after: auto;
        }

        /* SVG растягиваем ровно на страницу */
        .sheet-page svg {
            display: block;
            width: 297mm !important;
            height: 210mm !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }

        /* Поля ввода становятся прозрачным текстом */
        .sheet-field {
            background: transparent !important;
            border: none !important;
            color: #000 !important;
            padding: 0 3px !important;
        }
        .sheet-field:focus {
            background: transparent !important;
        }
        .sheet-field::placeholder {
            color: transparent !important;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .sheet-readonly { color: #000 !important; }
        .sheet-checkbox { background: transparent !important; }

        /* Убираем подсветку отладки */
        body.debug .sheet-field,
        body.debug .sheet-readonly,
        body.debug .sheet-checkbox {
            background: transparent !important;
            border: none !important;
        }
    }
</style>

<script>
// ============================================================
//  РЕДАКТОР ЛИСТА ПЕРСОНАЖА
// ============================================================

let sheetId = null;          // ID листа (null если новый)
let isDirty = false;         // были ли изменения
let saveTimeout = null;
let avatarData = null;       // base64 аватара

// ============================================================
//  ОТЛАДКА
// ============================================================
document.getElementById('btn-debug').addEventListener('click', () => {
    document.body.classList.toggle('debug');
});

// ============================================================
//  ID ПАРАМЕТР ИЗ URL
// ============================================================
function getIdFromUrl() {
    const params = new URLSearchParams(location.search);
    return params.get('id');
}

// ============================================================
//  АВТОРАСЧЁТ (остаётся как было)
// ============================================================
function getStatValue(statId) {
    const el = document.getElementById(statId);
    return el ? (parseInt(el.value) || 0) : 0;
}
function updateAllStats() {
    document.querySelectorAll('.sheet-readonly[data-stat]').forEach(el => {
        const value = getStatValue(el.dataset.stat);
        el.textContent = value || '—';
    });
}
function updateAllSums() {
    document.querySelectorAll('[id$="-rank"]').forEach(rankEl => {
        const prefix = rankEl.id.replace(/-rank$/, '');
        const statEl = document.getElementById(prefix + '-stat');
        const sumEl = document.getElementById(prefix + '-sum');
        if (!statEl || !sumEl) return;
        const rank = parseInt(rankEl.value) || 0;
        const stat = parseInt(statEl.textContent) || 0;
        sumEl.textContent = (rank + stat) || '—';
    });
}
function recalculate() {
    updateAllStats();
    updateAllSums();
}
['int','rea','lov','teh','har','vol','yda','sko','tel','emp'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', recalculate);
});
document.addEventListener('input', (e) => {
    if (e.target?.id?.endsWith('-rank')) updateAllSums();
    isDirty = true;
    scheduleAutosave();
});
document.addEventListener('change', (e) => {
    if (e.target?.classList?.contains('sheet-checkbox')) {
        isDirty = true;
        scheduleAutosave();
    }
});
document.addEventListener('input', (e) => {
    if (e.target?.classList?.contains('sheet-field')) {
        isDirty = true;
        scheduleAutosave();
    }
});

// ============================================================
//  СБОР ДАННЫХ ИЗ ФОРМЫ
// ============================================================
function collectData() {
    const data = {};
    document.querySelectorAll('.sheet-field, .sheet-checkbox').forEach(el => {
        if (!el.id) return;
        data[el.id] = el.type === 'checkbox' ? el.checked : el.value;
    });
    if (avatarData) data.avatar = avatarData;
    return data;
}

// ============================================================
//  ЗАПОЛНЕНИЕ ФОРМЫ ИЗ ДАННЫХ
// ============================================================
function fillData(data) {
    if (!data) return;
    Object.entries(data).forEach(([id, val]) => {
        if (id === 'avatar') {
            if (val) setAvatar(val);
            return;
        }
        const el = document.getElementById(id);
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!val;
        else el.value = val;
    });
    recalculate();
}

// ============================================================
//  АВАТАР
// ============================================================
function setAvatar(dataUrl) {
    avatarData = dataUrl;
    const img = document.getElementById('avatar-img');
    const ph = document.getElementById('avatar-placeholder');
    img.src = dataUrl;
    img.style.display = 'block';
    ph.style.display = 'none';
}

document.getElementById('avatar-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Читаем файл
    const reader = new FileReader();
    reader.onload = (ev) => {
        // Сжимаем через canvas до 200x200
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 200;
            let w = img.width, h = img.height;
            const ratio = Math.min(MAX / w, MAX / h, 1);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // JPEG с качеством 0.85 — компактно
            const compressed = canvas.toDataURL('image/jpeg', 0.85);
            setAvatar(compressed);
            isDirty = true;
            scheduleAutosave();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

// ============================================================
//  СОХРАНЕНИЕ
// ============================================================
function setStatus(text, cls) {
    const el = document.getElementById('save-status');
    el.textContent = text;
    el.className = 'sheet-save-status ' + (cls || '');
}

async function saveSheet(manual = false) {
    const name = document.getElementById('sheet-name-display').value.trim();
    if (!name) {
        if (manual) {
            toast('Введи имя персонажа', 'error');
            document.getElementById('sheet-name-display').focus();
        }
        return;
    }

    setStatus('Сохранение…', 'saving');
    const data = collectData();

    try {
        if (sheetId) {
            await api.put(`/characters/${sheetId}`, { name, data });
        } else {
            const created = await api.post('/characters', { name, data });
            sheetId = created.id;
            // Обновляем URL без перезагрузки
            history.replaceState({}, '', `character-sheet.html?id=${sheetId}`);
        }
        setStatus('Сохранено', 'saved');
        isDirty = false;
        if (manual) toast('Сохранено', 'success');
        setTimeout(() => { if (!isDirty) setStatus(''); }, 2000);
    } catch (err) {
        setStatus('Ошибка: ' + err.message, 'error');
        if (manual) toast(err.message, 'error');
    }
}

function scheduleAutosave() {
    clearTimeout(saveTimeout);
    setStatus('Не сохранено', 'saving');
    saveTimeout = setTimeout(() => saveSheet(false), 3000);
}

document.getElementById('btn-save').addEventListener('click', () => saveSheet(true));

// ============================================================
//  ПЕЧАТЬ
// ============================================================
document.getElementById('btn-print').addEventListener('click', () => {
    window.print();
});

// ============================================================
//  УДАЛЕНИЕ
// ============================================================
document.getElementById('btn-delete').addEventListener('click', async () => {
    if (!sheetId) {
        if (confirm('Лист не сохранён. Вернуться к списку?')) {
            window.location.href = 'characters.html';
        }
        return;
    }
    if (!confirm('Удалить лист? Действие необратимо.')) return;
    try {
        await api.delete(`/characters/${sheetId}`);
        toast('Лист удалён', 'success');
        setTimeout(() => location.href = 'characters.html', 500);
    } catch (err) {
        toast(err.message, 'error');
    }
});

// ============================================================
//  НАЗАД
// ============================================================
document.getElementById('btn-back').addEventListener('click', async () => {
    if (isDirty) {
        await saveSheet(false);
    }
    location.href = 'characters.html';
});

// Предупреждение при закрытии страницы с несохранёнными изменениями
window.addEventListener('beforeunload', (e) => {
    if (isDirty) {
        e.preventDefault();
        e.returnValue = '';
    }
});

// ============================================================
//  ЗАГРУЗКА ПРИ СТАРТЕ
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    await loadSession();
    renderHeader();

    if (!CURRENT_USER) {
        location.href = 'characters.html';
        return;
    }

    sheetId = getIdFromUrl();

    if (sheetId) {
        try {
            const sheet = await api.get(`/characters/${sheetId}`);
            document.getElementById('sheet-name-display').value = sheet.name;
            fillData(sheet.data || {});
            setStatus('');
        } catch (err) {
            toast('Лист не найден', 'error');
            setTimeout(() => location.href = 'characters.html', 1000);
            return;
        }
    } else {
        setStatus('');
        recalculate();
    }

    // Сохранение при смене имени — тоже автосейв
    document.getElementById('sheet-name-display').addEventListener('input', () => {
        isDirty = true;
        scheduleAutosave();
    });

    // Ctrl+S — сохранить
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            saveSheet(true);
        }
    });
});
</script>
